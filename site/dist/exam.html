<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic Exam · The Compounding MBA</title>
<link rel="stylesheet" href="style.css">
<style>
.exam-wrap{max-width:760px;margin:0 auto;padding:30px 24px 120px}
.exam-q{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 14px;background:var(--surface)}
.exam-q .dtag{font:600 .62rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-bottom:8px;display:inline-block}
.exam-q .qn{font:600 1.02rem/1.5 var(--read);color:var(--ink);margin:0 0 12px}
.exam-opt{display:block;width:100%;text-align:left;padding:11px 14px;margin:6px 0;border:1px solid var(--line2);border-radius:7px;background:var(--bg2);color:var(--ink2);font:.96rem var(--read);cursor:pointer;transition:.15s}
.exam-opt:hover{border-color:var(--brass)}
.exam-opt.sel{border-color:var(--brass);background:rgba(203,162,79,.12);color:var(--ink)}
.exam-opt.correct{border-color:var(--core);background:rgba(132,173,138,.16);color:var(--ink)}
.exam-opt.wrong{border-color:var(--wrong);background:rgba(207,106,90,.14)}
.exam-fb{margin:10px 0 0;font:.9rem/1.55 var(--read);color:var(--dim);display:none}
.exam-fb.show{display:block}
#scorebar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#scorebar b{color:var(--brass2)}
.bigbtn{padding:13px 26px;border:0;border-radius:8px;background:var(--brass);color:#0c100e;font:600 .95rem var(--mono);letter-spacing:.04em;cursor:pointer}
.bigbtn:disabled{opacity:.4;cursor:default}
.result{border:1px solid var(--brass);border-radius:12px;padding:24px;margin:0 0 22px;background:var(--surface2);display:none}
.result.show{display:block;animation:rise .5s both}
.result h2{margin:0 0 6px;font:300 2.4rem/1 var(--serif);color:var(--ink)}
.result .band{font:600 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.dom-row{display:grid;grid-template-columns:200px 1fr 64px;gap:12px;align-items:center;margin:9px 0;font:.9rem var(--read)}
.dom-bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.dom-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--core),var(--brass2))}
.note{font:.84rem/1.6 var(--read);color:var(--dim);border-left:2px solid var(--line2);padding-left:14px;margin:18px 0}
@media(max-width:560px){.dom-row{grid-template-columns:120px 1fr 50px}}
</style></head><body>
<div class="grain"></div><div class="atmos"></div>
<div id="scorebar">
<a href="index.html" class="home" style="font:.8rem var(--mono);color:var(--dim)">&larr; Index</a>
<span style="font:600 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)">Diagnostic Exam</span>
<span id="prog" style="font:.82rem var(--mono);color:var(--dim)"></span>
<button id="submit" class="bigbtn" style="margin-left:auto">Submit &amp; Score</button>
<button id="retake" class="bigbtn" style="display:none;background:var(--surface2);color:var(--ink);border:1px solid var(--line2)">Retake</button>
</div>
<div class="exam-wrap">
<div class="result" id="result"></div>
<p class="note" id="introNote"></p>
<div id="questions"></div>
</div>
<script>
const BANK = [{"id": "canon-behavioral-decision-0", "domain": "Quantitative & Statistics", "q": "The Economist offered print-only at the same price as print + web. Why include an option nobody picks?", "opts": ["To clear out old print inventory", "As a decoy — it makes the print + web bundle look like a \"fantastic deal\" by comparison", "To comply with a publishing regulation"], "correct": 1, "fb": "It's a decoy. We judge value only by comparison, so a strictly-worse option at the same price makes the target look like free upside. Remove the decoy and the cheapest option wins instead.", "src": "canon-behavioral-decision"}, {"id": "canon-behavioral-decision-1", "domain": "Quantitative & Statistics", "q": "Opt-out countries have far higher organ-donor rates than opt-in countries, with the same people. Why?", "opts": ["Opt-out countries run better awareness campaigns", "People in those countries care more about donation", "The default does the work — most people take whatever happens when they do nothing"], "correct": 2, "fb": "\"The moment you set this as the default it has a huge power.\" Opting out costs a small act of will most people never spend — so the default, not anyone's stated preference, drives the outcome.", "src": "canon-behavioral-decision"}, {"id": "canon-behavioral-decision-2", "domain": "Quantitative & Statistics", "q": "Klein's expert firefighters, facing a tough emergency, made decisions by:", "opts": ["Pattern-matching to one course of action and mentally simulating it — not comparing options", "Listing every option and scoring each on weighted criteria", "Always deferring to the most senior officer present"], "correct": 0, "fb": "Recognition-Primed Decision: experience produces a pattern match to a single workable option, which they simulate forward (\"like popping a DVD into a player\"). They don't compare — and in feedback-rich domains, that's a strength.", "src": "canon-behavioral-decision"}, {"id": "canon-ethics-judgment-0", "domain": "Legal & Ethical", "q": "According to Badaracco, the decisions that truly test and shape character are:", "opts": ["Right vs. wrong — you just need the courage to act", "Always resolved by calculating the greatest good for the greatest number", "Right vs. right — two defensible goods that can't both be honored"], "correct": 2, "fb": "Badaracco's \"defining moments\" are right-vs-right: truth vs. loyalty, short vs. long term, individual vs. community. Right-vs-wrong needs nerve; right-vs-right needs judgment, and reveals who you are.", "src": "canon-ethics-judgment"}, {"id": "canon-ethics-judgment-1", "domain": "Legal & Ethical", "q": "Most people will divert the trolley with a lever but refuse to push a man off a bridge — even though both kill one to save five. Why?", "opts": ["The lever version saves more lives", "Their lens switches from consequences (welfare) to categorical duty (rights) without them noticing", "Pushing is illegal and diverting isn't"], "correct": 1, "fb": "The body count is identical. Pushing uses a person as a mere means — which the categorical/rights lens forbids regardless of outcome. Sandel's point is that we change lenses unconsciously.", "src": "canon-ethics-judgment"}, {"id": "canon-ethics-judgment-2", "domain": "Legal & Ethical", "q": "Rawls' \"veil of ignorance\" asks you to choose society's rules:", "opts": ["Without knowing which role or position you'll occupy in it", "By calculating the single greatest aggregate of happiness", "According to whatever your culture has always done"], "correct": 0, "fb": "Behind the veil you don't know if you'll be rich or poor, majority or minority — so you'd reject pure utilitarianism and protect everyone's dignity, including the people who might turn out to be you.", "src": "canon-ethics-judgment"}, {"id": "canon-game-theory-0", "domain": "Economics", "q": "Why did banning cigarette TV ads in 1971 raise tobacco-company profits?", "opts": ["Smokers bought more once ads disappeared", "The ban ended a prisoner's-dilemma ad arms race the firms couldn't escape themselves", "It let firms raise prices by law"], "correct": 1, "fb": "The firms were trapped advertising ($40M each) when not advertising would earn more ($50M each) — but neither could stop unilaterally. The ban removed the option to defect, forcing the cooperative outcome.", "src": "canon-game-theory"}, {"id": "canon-game-theory-1", "domain": "Economics", "q": "Two ice-cream vendors end up back-to-back in the middle of the beach. This is:", "opts": ["The socially optimal outcome", "An irrational mistake", "A Nash equilibrium — stable, but not best for customers"], "correct": 2, "fb": "Each creeps center to steal share until neither can improve by moving alone — a Nash equilibrium. The spread-out version would serve customers better, but it isn't stable.", "src": "canon-game-theory"}, {"id": "canon-game-theory-2", "domain": "Economics", "q": "In a repeated prisoner's dilemma, Axelrod's tournament-winning strategy was:", "opts": ["Tit for Tat — cooperate first, then mirror; nice, retaliatory, forgiving, clear", "Always defect to stay safe", "A complex unpredictable strategy to confuse opponents"], "correct": 0, "fb": "The simplest strategy won. Cooperate first, then do whatever they last did. Predictable fairness beats cleverness when you'll interact again.", "src": "canon-game-theory"}, {"id": "canon-history-judgment-0", "domain": "Strategy", "q": "Allison found 16 historical cases of a rising power challenging a ruling one. What does the count actually show?", "opts": ["All 16 ended in war — the trap is a deterministic law", "Only a handful ended in war — the danger is overstated", "12 ended in war and 4 escaped — a strong danger signal, but not inevitable"], "correct": 2, "fb": "12 of 16 ended in war, but 4 did not. Allison stresses the Greek \"inevitable\" means very likely, baked into the structure — not 100%. The four escapes are the whole point: the trap can be steered out of.", "src": "canon-history-judgment"}, {"id": "canon-history-judgment-1", "domain": "Strategy", "q": "The U.S. chose a naval blockade over an airstrike in the Cuban Missile Crisis. Through Allison's lens, the deepest reason was:", "opts": ["Blockade was simply the most rational, optimal choice (Model I)", "The air force had no runnable protocol in the time available; the navy did (Model II)", "The public demanded a softer response"], "correct": 1, "fb": "This is Model II — Organizational Process. The decision was an output of which organization already had a deployable routine, not of pure optimized interest. The clean \"rational actor\" story explains the least.", "src": "canon-history-judgment"}, {"id": "canon-history-judgment-2", "domain": "Strategy", "q": "A colleague says: \"This expansion is just like when we entered Region X and won.\" The Neustadt & May move is to:", "opts": ["List the likenesses AND the differences before letting the analogy drive the call", "Trust the analogy — it worked last time", "Reject all analogies as useless"], "correct": 0, "fb": "Force the two-column list. The error is applying a parallel wholesale; surface resemblance isn't structural similarity. Separate what you know from what you merely presume — most errors come from treating presumptions as facts.", "src": "canon-history-judgment"}, {"id": "canon-information-communication-0", "domain": "Communication", "q": "In Shannon's theory, which message carries the most information?", "opts": ["A long, beautifully written essay", "A message you could have predicted in advance", "A surprising result you assigned low probability to"], "correct": 2, "fb": "Information = uncertainty removed = surprise. A perfectly predictable message carries zero bits; the lower the probability of what you learn, the more information it conveys. Length and beauty are irrelevant to the math — \"content is irrelevant.\"", "src": "canon-information-communication"}, {"id": "canon-information-communication-1", "domain": "Communication", "q": "For Tufte, the very first quality of graphical excellence is:", "opts": ["Honesty — show the data as it is, don't predetermine the outcome and cherry-pick", "Beauty — impress the reader with polish and 3-D effects", "Brevity — always use the fewest possible data points"], "correct": 0, "fb": "Honesty ranks above even erasing chartjunk. \"We don't predetermine the outcome we want and then cherry-pick the data.\" A pretty chart that distorts (a high lie factor) fails the first test; \"no one is that impressed by how pretty you make your chart.\"", "src": "canon-information-communication"}, {"id": "canon-information-communication-2", "domain": "Communication", "q": "A teammate goes quiet and defensive mid-conversation. The Crucial Conversations move is to:", "opts": ["Push your point harder and more forcefully until they engage", "Read it as lost safety and stop to restore it before continuing on content", "End the conversation — they're clearly not ready"], "correct": 1, "fb": "Silence or violence is a safety signal, not data to argue with. Stop pushing content and restore safety — mutual purpose, mutual respect, a contrasting statement (\"I have no concerns with your work… I'm trying to…\"). Then the real issue surfaces.", "src": "canon-information-communication"}, {"id": "canon-platform-strategy-0", "domain": "Strategy", "q": "What fundamentally separates a platform like Airbnb from a pipeline like Safeway?", "opts": ["Airbnb has higher marginal costs", "Safeway has network effects; Airbnb doesn't", "Airbnb owns no inventory — it takes a commission for facilitating a transaction"], "correct": 2, "fb": "\"Unlike Safeway, Airbnb never has a traditional cost of goods sold… Airbnb exists to facilitate that transaction.\" A platform monetizes a connection it doesn't own, via a take-rate.", "src": "canon-platform-strategy"}, {"id": "canon-platform-strategy-1", "domain": "Strategy", "q": "Google gives search away free and charges advertisers. Why subsidize the user side?", "opts": ["Users are more profitable than advertisers", "The free side is price-sensitive and draws the other side, which is what advertisers are buying", "It's illegal to charge for search"], "correct": 1, "fb": "Hagiu & Wright's rule: subsidize the price-sensitive / network-driving side, charge the other. The audience is the product advertisers pay for, so you maximize it by making it free.", "src": "canon-platform-strategy"}, {"id": "canon-platform-strategy-2", "domain": "Strategy", "q": "According to Andrew Chen, how did the winning platforms actually solve the cold-start problem?", "opts": ["They hand-built a high-quality \"atomic network\" manually, then operationalized it", "They launched everywhere at once for maximum scale", "They relied on viral acquisition loops to fill both sides automatically"], "correct": 0, "fb": "\"They manually did it, and then they found ways to operationalize it.\" The first network is hand-assembled, one node at a time — and a viral effect (acquisition) is not the same as a network effect.", "src": "canon-platform-strategy"}, {"id": "canon-power-politics-0", "domain": "Management & OB", "q": "According to Pfeffer, the single biggest barrier to having power is:", "opts": ["Not enough raw talent or work ethic", "A bad boss blocking you", "Ourselves — the just-world belief makes us \"less vigilant and strategic than required\""], "correct": 2, "fb": "Pfeffer: \"the biggest barrier… is of course ourselves.\" Believing the world is fair and that great work is automatically rewarded makes you stop playing a game that's running anyway.", "src": "canon-power-politics"}, {"id": "canon-power-politics-1", "domain": "Management & OB", "q": "Greene says the 48 Laws is most valuable when used as:", "opts": ["A daily checklist of moves to run on colleagues", "A defensive field guide — recognizing the moves being run on you", "A history book with no modern application"], "correct": 1, "fb": "\"A lot of it's about defense… here's how you defend yourself.\" Naming a move strips its power. Run as offense, the laws are survivorship-biased and corrode the reputation Law 5 says to guard.", "src": "canon-power-politics"}, {"id": "canon-power-politics-2", "domain": "Management & OB", "q": "Pfeffer's first practical step to building power is to:", "opts": ["Diagnose who really has power — including informal power like an assistant or gatekeeper", "Ask your manager for a promotion immediately", "Work harder and wait to be noticed on merit"], "correct": 0, "fb": "\"Diagnose who has power — not just the formal power but the informal power… oftentimes it's an assistant or a secretary.\" The real decision network rarely matches the org chart.", "src": "canon-power-politics"}, {"id": "canon-risk-fragility-0", "domain": "Quantitative & Statistics", "q": "What is the true opposite of \"fragile,\" per Taleb?", "opts": ["Robust — it survives the shock unchanged", "Resilient — it bounces back to where it was", "Antifragile — it gains from the shock"], "correct": 2, "fb": "Robust and resilient merely survive disorder. The genuine opposite of something that's harmed by volatility is something that benefits from it — \"shake me, I'll benefit from it.\" Resilience is the ceiling for robustness, not the opposite of fragile.", "src": "canon-risk-fragility"}, {"id": "canon-risk-fragility-1", "domain": "Quantitative & Statistics", "q": "Why does Taleb say \"predicting future events is largely irrelevant\"?", "opts": ["Because you can control your exposure to shocks even when you can't forecast them", "Because the future is fully random and nothing can be known", "Because experts are always wrong about everything"], "correct": 0, "fb": "You can't predict when a plane crashes, but you can see that it can — so you screen for weapons. Focusing on exposure (cutting fatal downside, buying optionality) makes the unforecastable timing irrelevant. That's the barbell logic.", "src": "canon-risk-fragility"}, {"id": "canon-risk-fragility-2", "domain": "Quantitative & Statistics", "q": "A forecaster who posts \"60%\" on every question and never moves it is failing at:", "opts": ["Calibration — their 60%s never happen 60% of the time", "Resolution and updating — they never revise as evidence arrives, so they never learn", "Honesty — 60% is a dishonest number"], "correct": 1, "fb": "Staying near a flat number \"avoids being wrong but also avoids being useful.\" The superforecaster revises 40 → 55 → 70 as facts change and keeps score — that updating loop, fed by a scorecard, is the skill.", "src": "canon-risk-fragility"}, {"id": "canon-systems-complexity-0", "domain": "Operations", "q": "In the Beer Game, a small demand bump becomes a 150% swing at the factory. The cause is:", "opts": ["An incompetent factory manager who panicked", "Customers behaving irrationally", "The structure — delays plus local overreaction plus no shared information"], "correct": 2, "fb": "Sterman's point: replace every player with a genius and the oscillation still happens. The bullwhip is a property of the structure (delays + information blackout + local optimizing), not the people. Fix it by sharing demand info and shortening delays.", "src": "canon-systems-complexity"}, {"id": "canon-systems-complexity-1", "domain": "Operations", "q": "According to Meadows, which of these is the most powerful leverage point?", "opts": ["The paradigm — the shared, usually unspoken goal the system serves", "A number / parameter, like a tax rate or quarterly target", "Adding another automated safety feature", "Working harder against the constraint"], "correct": 0, "fb": "Meadows ranks interventions least-to-most effective, and the paradigm sits at the top while numbers/parameters sit at the bottom. Most people spend all their effort on the feeblest rung — tweaking parameters — and ignore the powerful ones.", "src": "canon-systems-complexity"}, {"id": "canon-systems-complexity-2", "domain": "Operations", "q": "Senge's \"the harder you push, the harder the system pushes back\" describes:", "opts": ["A motivational slogan about persistence", "Compensating feedback — a balancing loop that erases your effort", "Why you should always escalate faster"], "correct": 1, "fb": "It's compensating feedback: your intervention triggers a balancing loop that pushes back, so brute force gets absorbed. The systems-thinking response is to find a higher leverage point, not to push harder.", "src": "canon-systems-complexity"}, {"id": "core-01-accounting-0", "domain": "Accounting", "q": "A company has Revenue $500, COGS $300, all other costs $150. What's its net income?", "opts": ["$200", "$50", "$350"], "correct": 1, "fb": "Gross profit = 500 − 300 = $200, then − $150 of other costs = $50 net income (a 10% net margin).", "src": "core-01-accounting"}, {"id": "core-01-accounting-1", "domain": "Accounting", "q": "If Assets are $80 and Liabilities are $50, what is Equity?", "opts": ["$130", "$80", "$30"], "correct": 2, "fb": "Equity = Assets − Liabilities = 80 − 50 = $30 — the owners' true stake.", "src": "core-01-accounting"}, {"id": "core-01-accounting-2", "domain": "Accounting", "q": "A startup reports $2M profit but can't make payroll. Which statement reveals the problem?", "opts": ["The income statement", "The balance sheet", "The cash flow statement"], "correct": 2, "fb": "The profit is tied up in unpaid invoices — the cash flow statement exposes the cash gap the income statement hides.", "src": "core-01-accounting"}, {"id": "core-02-corporate-finance-0", "domain": "Finance", "q": "At a 10% discount rate, is $100 received in 5 years worth more, the same, or less than $100 today?", "opts": ["More — it grows", "Exactly the same", "Less — about $62"], "correct": 2, "fb": "$100 ÷ (1.10)⁵ = $62.10. Future cash is always worth less today; that shrinkage is discounting.", "src": "core-02-corporate-finance"}, {"id": "core-02-corporate-finance-1", "domain": "Finance", "q": "A company is 80% equity (cost 15%) and 20% debt (after-tax cost 7%). What is its WACC?", "opts": ["13.4%", "22.0%", "11.0%"], "correct": 0, "fb": "(0.80 × 15%) + (0.20 × 7%) = 12% + 1.4% = 13.4% — the weighted blend of both money sources.", "src": "core-02-corporate-finance"}, {"id": "core-02-corporate-finance-2", "domain": "Finance", "q": "A stock's market price is $42 but your DCF says its intrinsic value is $36. What does that gap suggest?", "opts": ["It's a bargain — buy", "It looks overpriced — the market pays more than the cash is worth", "Price and value are always equal"], "correct": 1, "fb": "Price ($42) above intrinsic value ($36) means the market is paying more than the cash justifies — a potential sell. Price and value are different processes.", "src": "core-02-corporate-finance"}, {"id": "core-03-micro-strategy-0", "domain": "Economics", "q": "The British government couldn't reduce convict-ship deaths with laws or appeals. What finally worked?", "opts": ["Hiring more doctors", "Building bigger ships", "Paying captains only for prisoners who arrived alive"], "correct": 2, "fb": "Changing the incentive — pay on safe arrival, not departure — pushed the survival rate to 99% overnight. Change the reward, change the behavior.", "src": "core-03-micro-strategy"}, {"id": "core-03-micro-strategy-1", "domain": "Economics", "q": "Two firms both advertise and each ends up at $40M, when both staying quiet would have earned each $50M. What is this outcome called?", "opts": ["A win-win equilibrium", "A Nash equilibrium (a prisoner's dilemma)", "A price signal"], "correct": 1, "fb": "Each defects because advertising is individually best whatever the rival does — so both land in a stable but worse-for-everyone Nash equilibrium, the classic prisoner's dilemma.", "src": "core-03-micro-strategy"}, {"id": "core-03-micro-strategy-2", "domain": "Economics", "q": "You've read 100 pages of a book you're not enjoying. The \"rational\" reason to keep reading is…", "opts": ["There isn't one — the 100 pages are a sunk cost", "You already invested time, so finishing recovers it", "Quitting wastes the pages you read"], "correct": 0, "fb": "The 100 pages are spent and unrecoverable — a sunk cost. A forward-looking decision ignores them and asks only: is the next page worth it?", "src": "core-03-micro-strategy"}, {"id": "core-04-competitive-strategy-0", "domain": "Strategy", "q": "An industry has many equal-sized firms competing almost only on price, low barriers to entry, and powerful suppliers. What does the Five Forces model predict?", "opts": ["High, durable profits for everyone", "Structurally low industry profitability", "Profitability depends only on who has the biggest market share"], "correct": 1, "fb": "Strong rivalry + easy entry + powerful suppliers all drain profit — a \"zero-star\" structure like airlines. Market share doesn't rescue a bad structure.", "src": "core-04-competitive-strategy"}, {"id": "core-04-competitive-strategy-1", "domain": "Strategy", "q": "Continental launched Continental Lite to fight Southwest while keeping full service, and failed. The core lesson is:", "opts": ["Low-cost airlines can never be beaten", "Operational effectiveness is all that matters", "Straddling two positions forces bad trade-offs — strategy requires choosing what NOT to do"], "correct": 2, "fb": "Trying to occupy two positions at once created non-complementary activities. Trade-offs and fit are what make a position defensible.", "src": "core-04-competitive-strategy"}, {"id": "core-04-competitive-strategy-2", "domain": "Strategy", "q": "Netflix and Disney FY2025: Netflix earns $10.98B on $45.18B revenue; Disney earns $12.40B on $94.42B. Whose business keeps more of each sales dollar?", "opts": ["Netflix — 24.3% net margin vs Disney's 13.1%", "Disney — it has more total revenue", "They're identical because both are entertainment companies"], "correct": 0, "fb": "Netflix: 10.98 ÷ 45.18 = 24.3%. Disney: 12.40 ÷ 94.42 = 13.1%. More revenue ≠ better margin; competitive position drives profitability.", "src": "core-04-competitive-strategy"}, {"id": "core-05-marketing-brand-0", "domain": "Marketing", "q": "In Dunford's method, what is the very first step of positioning?", "opts": ["Write a catchy tagline", "Pick your market category", "Identify the competitive alternatives — what you must beat"], "correct": 2, "fb": "You can't claim you're \"different\" until you've defined different from what. Alternatives (including the status quo) come first; value and category flow from there.", "src": "core-05-marketing-brand"}, {"id": "core-05-marketing-brand-1", "domain": "Marketing", "q": "A customer buys a morning milkshake for a boring commute. In JTBD terms, what is the milkshake competing against?", "opts": ["Other milkshake brands only", "Bagels, bananas and donuts — anything else hired for that same job", "Nothing; it has no competition"], "correct": 1, "fb": "The job defines the competitive set. For the commute job, the milkshake competes with bagels, bananas and donuts — not just other shakes.", "src": "core-05-marketing-brand"}, {"id": "core-05-marketing-brand-2", "domain": "Marketing", "q": "Nike's FY2025 gross margin is ~42.7% while a generic factory's is far lower. What does that gap mostly reflect?", "opts": ["Brand pricing power — buyers pay a premium for the same physical product", "Nike's shoes cost much more to manufacture", "An accounting error"], "correct": 0, "fb": "Gross margin = gross profit ÷ revenue. A higher margin on a similar physical good signals pricing power — the financial signature of a strong brand.", "src": "core-05-marketing-brand"}, {"id": "core-06-operations-0", "domain": "Operations", "q": "A 4-step line has capacities 90, 60, 100, 120 units/hour. What is the line's throughput?", "opts": ["120 units/hour", "60 units/hour", "92.5 units/hour (the average)"], "correct": 1, "fb": "Throughput equals the capacity of the slowest step — the bottleneck at 60. No step can outrun it, and averaging is meaningless here.", "src": "core-06-operations"}, {"id": "core-06-operations-1", "domain": "Operations", "q": "A factory keeps 3 months of parts in a warehouse \"just in case.\" Which Lean idea attacks this most directly?", "opts": ["Jidoka (automation with a human touch)", "Kaizen (continuous improvement)", "Just-in-Time (produce/acquire only when needed)"], "correct": 2, "fb": "Just-in-Time targets excess inventory — it frees the cash tied up in stock and cuts warehouse cost and obsolescence risk.", "src": "core-06-operations"}, {"id": "core-06-operations-2", "domain": "Operations", "q": "Walmart and Amazon earn similar Return on Assets despite very different margins. Walmart pulls this off mainly through…", "opts": ["High asset turnover (selling its asset base fast)", "A higher net profit margin than Amazon", "Holding far more total assets than Amazon"], "correct": 0, "fb": "Walmart's thin 3% margin is rescued by spinning assets 2.51× a year vs Amazon's 0.88×. Speed of turnover substitutes for margin — and it actually holds fewer assets.", "src": "core-06-operations"}, {"id": "core-07-data-analytics-0", "domain": "Quantitative & Statistics", "q": "Conversions rose the week after you redesigned the homepage. Why can't you conclude the redesign caused it?", "opts": ["Because conversion rate is the wrong metric", "Because the sample was too large", "Because confounders (payday, weather, campaigns) also changed — only randomization isolates the cause"], "correct": 2, "fb": "\"Rose after\" is correlation. Without randomly splitting users, you can't separate the redesign from every other factor moving at the same time. That's why randomization is the gold standard.", "src": "core-07-data-analytics"}, {"id": "core-07-data-analytics-1", "domain": "Quantitative & Statistics", "q": "Your A/B tool reports a p-value of 0.05 as \"95% confident.\" What does the lecturer warn?", "opts": ["It means A beats B 95% of the time — trust it", "It's misleading; a p-value isn't the probability A beats B, and 0.05 may mean only ~42% chance of a real difference", "P-values are always wrong and should be ignored entirely"], "correct": 1, "fb": "A p-value answers a backwards question. For true high confidence you need values closer to 0.001 — \"95% confidence\" from p=0.05 overstates how sure you really are.", "src": "core-07-data-analytics"}, {"id": "core-07-data-analytics-2", "domain": "Quantitative & Statistics", "q": "You have one month of traffic. Which approach does the corpus favor for maximizing results?", "opts": ["Run several short experiments and deploy winners early", "Run one month-long experiment for maximum precision", "Skip testing and trust your intuition"], "correct": 0, "fb": "In the optimization mindset, big effects show up fast and small ones barely matter. More quick experiments beat one slow precise one — you're hunting for the rare big winner.", "src": "core-07-data-analytics"}, {"id": "core-08-negotiation-0", "domain": "Management & OB", "q": "A seller will accept £650+; a buyer will pay up to £750. What is the ZOPA?", "opts": ["There is no ZOPA — they're too far apart", "£650 to £750 — the overlap of both ranges", "£700 — they must split the difference"], "correct": 1, "fb": "The ZOPA is the overlap of the two acceptable ranges: £650–£750. Any price in that band beats both parties' BATNA, so a deal is possible without \"splitting the difference.\"", "src": "core-08-negotiation"}, {"id": "core-08-negotiation-1", "domain": "Management & OB", "q": "A guerrilla group says its position is \"independence.\" A skilled mediator's first move is to ask:", "opts": ["\"What's your final offer?\"", "\"Will you split the difference?\"", "\"Why? What are your underlying interests?\""], "correct": 2, "fb": "Ury's \"magical question\" is why. Behind the position (independence) sit interests — economic, cultural, political, recognition — that you may be able to satisfy even if you can't grant the position itself.", "src": "core-08-negotiation"}, {"id": "core-08-negotiation-2", "domain": "Management & OB", "q": "According to Voss, why prefer a question that invites \"no\" (e.g. \"Is now a bad time?\") over one chasing \"yes\"?", "opts": ["\"No\" makes people feel safe and in control of their autonomy", "\"No\" legally binds the other party", "\"Yes\" answers are always lies"], "correct": 0, "fb": "Backing people into a \"yes\" corner removes their autonomy and makes them resist. A \"no\" keeps them feeling safe and in control — which paradoxically moves the conversation forward.", "src": "core-08-negotiation"}, {"id": "core-09-leadership-ob-0", "domain": "Management & OB", "q": "A team has very high standards and intense pressure, but people are afraid to admit mistakes. Which zone are they in?", "opts": ["Comfort Zone", "Learning Zone", "Anxiety Zone"], "correct": 2, "fb": "High accountability + low safety = the Anxiety Zone — exactly where the silent nurse and pilot were. Dangerous: people hide problems instead of solving them.", "src": "core-09-leadership-ob"}, {"id": "core-09-leadership-ob-1", "domain": "Management & OB", "q": "According to Edmondson, psychological safety is best described as:", "opts": ["The goal of a great team", "The means to the goal of excellence", "Permission to be nice and avoid conflict"], "correct": 1, "fb": "It's the means, not the goal. The goal is excellence — and a safe team still has plenty of candid conflict. \"It's not about being nice.\"", "src": "core-09-leadership-ob"}, {"id": "core-09-leadership-ob-2", "domain": "Management & OB", "q": "Sinek says middle management is the hardest job mainly because:", "opts": ["People are promoted to lead without being taught how to lead", "Middle managers are paid the least", "There are too many committees"], "correct": 0, "fb": "The core problem is a training vacuum: we're shown how to do the technical job but never how to lead the people who now do it.", "src": "core-09-leadership-ob"}, {"id": "core-10-entrepreneurship-0", "domain": "Strategy", "q": "In the Business Model Canvas, which block sits in the middle and bridges the customer side to the infrastructure side?", "opts": ["Revenue Streams", "Key Partners", "Value Proposition"], "correct": 2, "fb": "The Value Proposition is the heart of the canvas — the value you deliver. Right-side blocks describe customers; left-side blocks describe what it takes to deliver that value.", "src": "core-10-entrepreneurship"}, {"id": "core-10-entrepreneurship-1", "domain": "Strategy", "q": "A founder has a big idea and thinks \"first I'll raise $2M, then build.\" What does the YC playbook advise instead?", "opts": ["Hire a banker to run the round before writing any code", "Build a small MVP, get real users, then raise from a position of leverage", "Wait until the product is fully polished and impressive before showing anyone"], "correct": 1, "fb": "It's cheaper than ever to ship a first version and find users. Doing that gives you leverage — \"investors want to jump on trains that are in motion.\"", "src": "core-10-entrepreneurship"}, {"id": "core-10-entrepreneurship-2", "domain": "Strategy", "q": "Gillette sells a cheap handle and profits from repeat blade sales. What is this pattern called?", "opts": ["Bait & hook", "Multi-sided market", "Freemium"], "correct": 0, "fb": "Bait & hook: an attractive, cheap (or loss-making) initial offer locks in profitable ongoing purchases. The same shape powers many SaaS free-trial-to-subscription models.", "src": "core-10-entrepreneurship"}, {"id": "core-11-global-macro-0", "domain": "International Business", "q": "A US firm is deciding the hurdle rate for a new factory in Pakistan. Whose country risk should it use?", "opts": ["The US — that's where the company is headquartered", "Pakistan — that's where the project operates", "The average of all countries on Earth"], "correct": 1, "fb": "Risk comes from where you operate, not where you're incorporated. The project lives in Pakistan, so it carries Pakistani country risk.", "src": "core-11-global-macro"}, {"id": "core-11-global-macro-1", "domain": "International Business", "q": "Markets just learned of a coup overnight. Which measure of default risk reflects it fastest?", "opts": ["The sovereign rating from Moody's", "Last year's PRS composite score", "The sovereign CDS spread"], "correct": 2, "fb": "The CDS spread is a live market price that moves in minutes. Ratings agencies are slow to adjust — Damodaran's main complaint about them.", "src": "core-11-global-macro"}, {"id": "core-11-global-macro-2", "domain": "International Business", "q": "Which pair of forces makes the BEST axes for a 2×2 scenario matrix?", "opts": ["Two things you're already confident about", "Two forces that are both highly uncertain AND highly impactful", "Your revenue last year and your headcount"], "correct": 1, "fb": "Scenario axes must be both uncertain and impactful. Things you're sure about are predetermined elements — they don't generate distinct futures.", "src": "core-11-global-macro"}, {"id": "core-11-global-macro-3", "domain": "International Business", "q": "\"We'll open three new stores, hire 50 people, and launch a loyalty app.\" According to HBR, this is…", "opts": ["A plan — a list of controllable activities, not a strategy", "A strategy — it positions the firm to win", "A scenario — a story about the future"], "correct": 0, "fb": "It's a plan: activities you control, on the cost side, with no theory of why customers will choose you. A strategy specifies a competitive outcome you don't fully control.", "src": "core-11-global-macro"}, {"id": "core-12-capstone-0", "domain": "Integration", "q": "In a SWOT, where does \"a new government tariff on imports\" belong for the company being analyzed?", "opts": ["Strength (internal)", "Threat (external)", "Weakness (internal)"], "correct": 1, "fb": "A tariff is an external force the firm can influence but not control — it lives in Opportunities/Threats, here a Threat. Internal/external is the line you must never blur.", "src": "core-12-capstone"}, {"id": "core-12-capstone-1", "domain": "Integration", "q": "Berkshire's equity is $717.4B and assets are $1,222.2B. Roughly how leveraged is it (Assets ÷ Equity)?", "opts": ["About 10×", "About 5×", "About 1.7×"], "correct": 2, "fb": "1,222.2 ÷ 717.4 ≈ 1.70× — owners fund most of the balance sheet. Very low leverage, the \"fortress\" Berkshire is known for.", "src": "core-12-capstone"}, {"id": "core-12-capstone-2", "domain": "Integration", "q": "Berkshire's net income ($67.0B) is well above its operating cash flow ($46.0B). What's the most likely capstone explanation?", "opts": ["Unrealized gains on its stock portfolio flow through net income", "The company is hiding fraud", "Revenue was overstated", "It paid too much tax"], "correct": 0, "fb": "Accounting rules push mark-to-market unrealized gains through net income, inflating it in good years. Cash flow strips that out — which is why you always reconcile the two.", "src": "core-12-capstone"}, {"id": "exec-E1-leading-at-scale-0", "domain": "Management & OB", "q": "According to Grove, what is a manager's true \"output\"?", "opts": ["The number of meetings they run and decisions they make", "Their personal hours worked each week", "The output of their team plus the teams they influence"], "correct": 2, "fb": "Meetings and hours are activities. Output is the result that flows through your organization and the neighboring teams under your influence.", "src": "exec-E1-leading-at-scale"}, {"id": "exec-E1-leading-at-scale-1", "domain": "Management & OB", "q": "A 25-year veteran is assigned a task they have never done before. Where should you START on the supervision spectrum?", "opts": ["Loose / delegate — they're experienced, leave them alone", "Close / structured — their task-relevant maturity is low", "It doesn't matter; pick whatever style suits you"], "correct": 1, "fb": "Style follows task-relevant maturity, not tenure. On a brand-new task even a veteran is a beginner, so begin with close, structured supervision and loosen as they master it.", "src": "exec-E1-leading-at-scale"}, {"id": "exec-E1-leading-at-scale-2", "domain": "Management & OB", "q": "Sinek draws the line between management and leadership as:", "opts": ["You manage things (processes, projects, schedules); you lead people", "You manage people; you lead processes", "They're the same thing with different names"], "correct": 0, "fb": "Management handles things — processes, projects, schedules. Leadership is the human responsibility to see the people around you rise.", "src": "exec-E1-leading-at-scale"}, {"id": "exec-E10-digital-ai-0", "domain": "Information Systems", "q": "According to Westerman's Law, where does the difficulty of transformation actually live?", "opts": ["In choosing the most advanced model", "In the gap between fast-changing tech and slow-changing organizations", "In the cost of GPUs"], "correct": 1, "fb": "Technology changes quickly; organizations change slowly. That gap — new habits, incentives, and processes — is the real work, and it's a leadership job.", "src": "exec-E10-digital-ai"}, {"id": "exec-E10-digital-ai-1", "domain": "Information Systems", "q": "Andrew Ng says most companies are more likely to fail because they…", "opts": ["Start too big with a grand vision that flops", "Start too small and never scale", "Hire too few data scientists"], "correct": 0, "fb": "A large early failure can set a company back years and drain its faith in AI. Start small, win quickly, then build bigger bets on that momentum.", "src": "exec-E10-digital-ai"}, {"id": "exec-E10-digital-ai-2", "domain": "Information Systems", "q": "In Choudary's shipping-container parable, the biggest impact of the new technology was…", "opts": ["Faster cranes at the port", "Cheaper dock labor", "Reorganizing the whole economy into global supply chains"], "correct": 2, "fb": "Automation (cranes) was only the first-order effect. The real value came from reliable shipping reshaping where and how the world manufactured — the second- and third-order effects. AI works the same way.", "src": "exec-E10-digital-ai"}, {"id": "exec-E11-operating-system-0", "domain": "Management & OB", "q": "According to the corpus, why do practitioners prefer \"managing energy\" over \"managing time\"?", "opts": ["Because time is unlimited but energy is scarce", "Because you can't actually manage time — only how you spend it — while energy can be grown and directed", "Because energy never runs out"], "correct": 1, "fb": "Everyone gets the same fixed 24 hours moving at the same pace, so \"managing\" time is a waste. Energy is the lever you can actually grow, spend, and direct — and output is energy × hours.", "src": "exec-E11-operating-system"}, {"id": "exec-E11-operating-system-1", "domain": "Management & OB", "q": "A CEO makes a big call after only skimming the 70-page report's executive summary, and it quietly fails months later. Which mental model names this mistake?", "opts": ["Circle of competence", "Reciprocity", "The map is not the territory"], "correct": 2, "fb": "The summary is the map; the real project is the territory. Deciding from the reduction without touching reality is exactly the trap — and the failure shows up months later, far from the decision.", "src": "exec-E11-operating-system"}, {"id": "exec-E11-operating-system-2", "domain": "Management & OB", "q": "You want to guarantee a recurring morning block for deep work. What does the corpus say to do?", "opts": ["Book it now, two months out where the calendar is still open, and make it repeating", "Wait until next week and squeeze it in", "Only block time once an urgent need appears"], "correct": 0, "fb": "Next week is already full. Go far enough out that the slot is open, book a repeating meeting with yourself, and by the time it arrives it's protected — trivial work gets pushed to the end of the day.", "src": "exec-E11-operating-system"}, {"id": "exec-E12-culture-strategy-0", "domain": "Management & OB", "q": "According to Sinek, why does writing \"Innovation\" as a company value on the wall fail to create it?", "opts": ["Because innovation can't be measured", "Because it's a result, not a behavior you can reward", "Because employees don't read wall posters"], "correct": 1, "fb": "Right — a value must be written as a verb (\"find a new way to solve a problem\") so you can incentivize and reward it. Nouns are results, not actions.", "src": "exec-E12-culture-strategy"}, {"id": "exec-E12-culture-strategy-1", "domain": "Management & OB", "q": "In Edmondson's matrix, why is staying silent the default behavior in a meeting?", "opts": ["Because people are naturally lazy", "Because speaking up benefits only you", "Because silence's payoff is immediate and certain, while speaking up pays off later and uncertainly"], "correct": 2, "fb": "Correct. Silence protects you now, with certainty; the benefit of voice is shared, delayed, and uncertain — so the brain defaults to silence unless leaders make it safe.", "src": "exec-E12-culture-strategy"}, {"id": "exec-E12-culture-strategy-2", "domain": "Management & OB", "q": "In Lencioni's model, what must exist before a team can have healthy conflict?", "opts": ["Vulnerability-based trust", "Accountability", "Measurable results"], "correct": 0, "fb": "Trust is the base of the pyramid. Without it, conflict becomes \"manipulation and politics\"; with it, conflict becomes the pursuit of truth.", "src": "exec-E12-culture-strategy"}, {"id": "exec-E2-capital-allocation-0", "domain": "Finance", "q": "A company's stock trades well above its true business value. Management launches a big buyback. From a capital-allocation view, this is…", "opts": ["Always smart — buybacks lift EPS", "Neutral — price doesn't matter", "A poor use of cash — you're overpaying for your own shares"], "correct": 2, "fb": "Buffett's rule: buy back only when the stock is below business value. Above it, \"you got no business buying in a single share.\" Price is everything.", "src": "exec-E2-capital-allocation"}, {"id": "exec-E2-capital-allocation-1", "domain": "Finance", "q": "Why do banks and other firms with bumpy earnings prefer buybacks over raising the dividend for their variable payout?", "opts": ["Buybacks are tax-free to the company", "Buybacks are flexible; cutting a dividend sends a harshly negative signal", "Dividends are illegal for banks"], "correct": 1, "fb": "A dividend cut \"sends a pretty negative signal to the market,\" so firms keep dividends conservative and flex the variable part through buybacks, which can go to zero in a quarter without alarm.", "src": "exec-E2-capital-allocation"}, {"id": "exec-E2-capital-allocation-2", "domain": "Finance", "q": "Apple generates ~$111B of operating cash on just ~$74B of equity. Why does it return most of that cash via buybacks instead of reinvesting it all?", "opts": ["It can't profitably reinvest that much inside the business above its hurdle rate", "Buybacks are required by law for tech companies", "It has no profitable operations left"], "correct": 0, "fb": "When cash generated exceeds what the business can reinvest at high returns, the disciplined move is to return it. Apple's small equity base relative to its cash flow is exactly why it's a buyback giant.", "src": "exec-E2-capital-allocation"}, {"id": "exec-E3-mergers-acquisitions-0", "domain": "Finance", "q": "A buyer pays a large premium expecting cost savings and cross-selling that never materialize. Which concept failed?", "opts": ["Due diligence", "Synergy", "Equity"], "correct": 1, "fb": "The premium was justified by expected synergy — combined value that proved \"difficult to achieve and more expensive than anticipated.\" No synergy, no deal logic.", "src": "exec-E3-mergers-acquisitions"}, {"id": "exec-E3-mergers-acquisitions-1", "domain": "Finance", "q": "Why does Schilling say buyers almost always overpay?", "opts": ["Banks force the price up", "Taxes make deals expensive", "The seller knows more, and you must bid above the current price to win"], "correct": 2, "fb": "It's \"easier to overpay than to underpay\": sellers hold the information edge, and winning a public target means bidding above its pre-deal price. If you didn't, owners wouldn't sell.", "src": "exec-E3-mergers-acquisitions"}, {"id": "exec-E3-mergers-acquisitions-2", "domain": "Finance", "q": "Microsoft has $343.48B equity, $275.52B liabilities and $136.16B annual operating cash flow. What does this tell you about a $68.7B acquisition?", "opts": ["It's easily affordable — about half a year of cash flow and ~20% of equity", "It would bankrupt the company", "It's impossible without issuing huge new debt"], "correct": 0, "fb": "$68.7B ÷ $136.16B ≈ 0.50 of one year's cash, and equity ($343.5B) dwarfs it. The balance sheet has ample capacity — the real risk is integration, not affordability.", "src": "exec-E3-mergers-acquisitions"}, {"id": "exec-E4-governance-board-0", "domain": "Legal & Ethical", "q": "A company's CEO is performing poorly and destroying value. Who has the formal power to remove them?", "opts": ["The other executives", "The board of directors", "Individual customers"], "correct": 1, "fb": "The board hires and fires the CEO on shareholders' behalf — that's its sharpest oversight tool.", "src": "exec-E4-governance-board"}, {"id": "exec-E4-governance-board-1", "domain": "Legal & Ethical", "q": "Why does a company appoint a lead independent director (as JPMorgan did under Jamie Dimon)?", "opts": ["To run day-to-day operations", "To increase the CEO's pay", "To preserve independent oversight when one person is both Chairman and CEO"], "correct": 2, "fb": "When the Chairman and CEO are the same person, a lead independent director keeps an unbiased voice for shareholders.", "src": "exec-E4-governance-board"}, {"id": "exec-E4-governance-board-2", "domain": "Legal & Ethical", "q": "An activist typically owns only 5–10% of a company. How do they actually force change?", "opts": ["By persuading other shareholders to back them in proxy votes", "By personally owning a majority of the shares", "By directly managing daily operations"], "correct": 0, "fb": "Without control, the activist must win over the other shareholders — \"it's a bit like running for office,\" as Ackman puts it.", "src": "exec-E4-governance-board"}, {"id": "exec-E5-transformation-0", "domain": "Management & OB", "q": "In Kotter's model, which step comes first — and is the most common point of failure?", "opts": ["Create a sense of urgency", "Generate short-term wins", "Anchor the change in the culture"], "correct": 0, "fb": "Urgency is Step 1. Without a shared, felt need to change now, people never let go of the status quo and the whole program stalls before it begins.", "src": "exec-E5-transformation"}, {"id": "exec-E5-transformation-1", "domain": "Management & OB", "q": "According to Sinek's law of diffusion, who should you aim your transformation energy at first?", "opts": ["The skeptical late majority", "The laggards, to remove resistance", "The early adopters, who'll sacrifice to back a belief"], "correct": 2, "fb": "You win the early adopters first. Once they cross the chasm (~15–18% penetration), the pragmatic majority follows on its own — you never have to convert it directly.", "src": "exec-E5-transformation"}, {"id": "exec-E5-transformation-2", "domain": "Management & OB", "q": "A team lands two quick wins, the CEO declares the transformation \"done,\" and attention moves on. What's the predictable result?", "opts": ["The change is now permanently anchored", "People backslide into the old way of working", "The guiding coalition automatically disbands successfully"], "correct": 1, "fb": "Declaring victory too early is the classic failure. Until new ways are deeply ingrained, people revert — wins must fuel the next push (Steps 7–8), not end the effort.", "src": "exec-E5-transformation"}, {"id": "exec-E6-crisis-leadership-0", "domain": "Management & OB", "q": "You're hit with more urgent tasks than you can handle. Per the CIA method, what do you do first?", "opts": ["Tackle the single most important task", "Push harder to do all of them at once", "Accept you can't finish all, then do the next fastest task"], "correct": 2, "fb": "That's operational prioritization. The fastest finishable task rebuilds momentum and confidence — your body can't argue that some tasks are quicker than others.", "src": "exec-E6-crisis-leadership"}, {"id": "exec-E6-crisis-leadership-1", "domain": "Management & OB", "q": "A new, fast-moving crisis hits and you don't have the answers. The strongest move is to…", "opts": ["Project total certainty so the team feels secure", "Share what you know, admit what you don't, and keep communicating", "Go quiet until you have a complete plan"], "correct": 1, "fb": "Humility plus frequent communication builds psychological safety. As the corpus puts it, it's more important to communicate when you don't have the answers than when you do.", "src": "exec-E6-crisis-leadership"}, {"id": "exec-E6-crisis-leadership-2", "domain": "Management & OB", "q": "According to Gary Klein's research, how do expert firefighters typically make decisions under extreme time pressure?", "opts": ["They pattern-match the situation, then mentally simulate one action", "They rank every option against weighted criteria", "They poll the whole team and take a vote"], "correct": 0, "fb": "That's the Recognition-Primed Decision (RPD) model. Experts recognize the situation from experience and evaluate a single option by imagining how it plays out — no side-by-side comparison.", "src": "exec-E6-crisis-leadership"}, {"id": "exec-E7-exec-presence-comms-0", "domain": "Communication", "q": "Which mindset shift does Ronin say both directs your delivery AND defuses self-doubt?", "opts": ["Dressing more formally before high-stakes meetings", "Switching from a \"me-first\" to an \"audience-first\" focus", "Memorizing your talk word-for-word"], "correct": 1, "fb": "Focusing on what you want the audience to think and feel moves the spotlight off yourself — so there's no room for \"am I being judged?\" while also guiding how you show up.", "src": "exec-E7-exec-presence-comms"}, {"id": "exec-E7-exec-presence-comms-1", "domain": "Communication", "q": "In Hewlett's research, which pillar of executive presence matters most?", "opts": ["Gravitas", "Appearance", "Communication"], "correct": 0, "fb": "Gravitas — confidence, poise, decisiveness, grace under fire — is \"the biggie\" across every sector. Communication is second; appearance is the smallest.", "src": "exec-E7-exec-presence-comms"}, {"id": "exec-E7-exec-presence-comms-2", "domain": "Communication", "q": "A talented manager does great work but \"nobody remembers them.\" On Sharma's 2×2, where are they?", "opts": ["Loud presence (high projection, thin substance)", "Powerful presence (depth, clearly conveyed)", "Mild presence (high internal growth, low projection)"], "correct": 2, "fb": "Mild presence — real depth trapped by an unwillingness to convey it. The fix is comfort projecting your competence, not more competence.", "src": "exec-E7-exec-presence-comms"}, {"id": "exec-E7-exec-presence-comms-3", "domain": "Communication", "q": "According to Abrahams, why does using a structure like \"What? So What? Now What?\" help?", "opts": ["It makes you sound more formal and authoritative", "Structured information is processed ~40% more effectively, freeing your mind", "It guarantees you'll never feel any anxiety"], "correct": 1, "fb": "Structure boosts processing fluency (~40%) for both speaker and audience — \"structure sets you free\" to focus on content, not scaffolding. Anxiety is managed, never erased.", "src": "exec-E7-exec-presence-comms"}, {"id": "exec-E8-stakeholder-ir-0", "domain": "Communication", "q": "According to Buffett, who should you imagine you're writing your shareholder letter to?", "opts": ["Wall Street analysts who model every number", "A smart owner who's been away a year", "Financial journalists looking for a headline"], "correct": 1, "fb": "Buffett pictures his sisters — smart owners, not active in the business, who need the real story in plain English. That \"owner's-eye view\" keeps the writing honest and jargon-free.", "src": "exec-E8-stakeholder-ir"}, {"id": "exec-E8-stakeholder-ir-1", "domain": "Communication", "q": "Your portfolio just had a terrible quarter and you must pause distributions. What's the best IR move?", "opts": ["Go quiet until you have better news to share", "Send the usual brief update and hope nobody asks", "Increase communication with a clear, honest report on what happened and the plan"], "correct": 2, "fb": "Like Richter's monthly COVID report: more transparency through bad news builds trust. His next raise was oversubscribed because investors felt informed, not abandoned.", "src": "exec-E8-stakeholder-ir"}, {"id": "exec-E8-stakeholder-ir-2", "domain": "Communication", "q": "Why is keeping \"one file\" — the same one investors and your team both see — so important?", "opts": ["It guarantees consistency and prevents the appearance (or reality) of hiding information", "It saves money on document storage", "Regulators require exactly one PDF per deal"], "correct": 0, "fb": "A single shared file means there's no \"investor version\" and \"real version.\" That transparency is the foundation of trust and fiduciary duty.", "src": "exec-E8-stakeholder-ir"}, {"id": "exec-E9-geopolitics-macro-0", "domain": "International Business", "q": "In the strategist's definition, which of these is NOT a normal tool of geopolitics?", "opts": ["Tariffs and trade policy", "Export controls and sanctions", "A company's internal marketing budget"], "correct": 2, "fb": "Geopolitics is about the tools nations use — trade policy, industrial policy, sanctions, security. A firm's own marketing budget isn't a tool of statecraft.", "src": "exec-E9-geopolitics-macro"}, {"id": "exec-E9-geopolitics-macro-1", "domain": "International Business", "q": "Why is a multipolar world considered more uncertain than a bipolar one?", "opts": ["There are fewer countries involved", "With many power centers, the great powers' calculations get much harder to predict", "It guarantees World War 3"], "correct": 1, "fb": "More poles = more independent actors (including swing middle powers), so outcomes are harder to predict. The lecturer was explicit that it means more uncertainty, not an inevitable war.", "src": "exec-E9-geopolitics-macro"}, {"id": "exec-E9-geopolitics-macro-2", "domain": "International Business", "q": "A flare-up near the Strait of Hormuz spikes oil prices. What's the most likely knock-on effect the analysts described?", "opts": ["Higher inflation pressure and reduced odds of Fed rate cuts", "Immediate, permanent deflation", "No effect on companies outside the region"], "correct": 0, "fb": "Pricier energy feeds inflation, which makes the Fed less likely to cut rates — rippling into bond yields and equities far beyond the region.", "src": "exec-E9-geopolitics-macro"}, {"id": "gaps-business-law-0", "domain": "Legal & Ethical", "q": "Your friend emails: \"I'll give you my used standing desk for free next week.\" He backs out. Why can't you enforce it?", "opts": ["There was no offer", "It wasn't in writing", "There's no consideration — you gave nothing of value in exchange, so it's an unenforceable gift promise"], "correct": 2, "fb": "Offer and acceptance existed, and most contracts needn't be written. The missing element is consideration: a contract requires each side to exchange something of value. A pure gift promise isn't a contract.", "src": "gaps-business-law"}, {"id": "gaps-business-law-1", "domain": "Legal & Ethical", "q": "You want to protect the secret algorithm your company uses to set prices. The right IP tool is:", "opts": ["A trade secret — kept confidential via NDAs and access limits; it can last forever as long as it stays secret", "A copyright registered with the Copyright Office", "A federal trademark"], "correct": 0, "fb": "A pricing algorithm you keep confidential is a classic trade secret (like Coke's formula). Trade secrets can't be registered — and shouldn't be; their protection comes from secrecy itself.", "src": "gaps-business-law"}, {"id": "gaps-business-law-2", "domain": "Legal & Ethical", "q": "At an industry dinner, a competitor suggests you both \"stop the discount war and hold prices.\" Agreeing would be:", "opts": ["Smart cooperation that's perfectly legal", "Price fixing — a core antitrust violation that can carry fines and even jail time", "Legal as long as it's not in writing"], "correct": 1, "fb": "Agreeing with a competitor on price is price fixing, a bright-line Sherman Act violation. Verbal or not, it abandons competition — exactly what antitrust law forbids.", "src": "gaps-business-law"}, {"id": "gaps-information-systems-0", "domain": "Information Systems", "q": "What is the core problem an ERP system solves?", "opts": ["It makes individual departments' software run faster", "It puts every department on one shared data core so a single event updates all of them", "It replaces the need for a database"], "correct": 1, "fb": "ERP's value is integration: without it, \"teams are stuck in separate systems that don't talk to each other.\" Sell one bag of dog food and inventory, revenue, and analytics all update at once — entered once, not five times.", "src": "gaps-information-systems"}, {"id": "gaps-information-systems-1", "domain": "Information Systems", "q": "In a relational database, a foreign key is:", "opts": ["A password that locks a table", "The unique ID identifying each row in its own table", "A column that references another table's primary key, linking the two"], "correct": 2, "fb": "The unique ID in a row's own table is the primary key. A foreign key is a field pointing at another table's primary key — that pointer is what lets a JOIN combine Books with Authors.", "src": "gaps-information-systems"}, {"id": "gaps-information-systems-2", "domain": "Information Systems", "q": "Two dashboards show different \"revenue\" numbers though the underlying data is clean. The governance fix is:", "opts": ["Agree one owned, documented definition of the metric — a single source of truth", "Buy a faster BI tool", "Delete one of the dashboards"], "correct": 0, "fb": "The data was clean; the conflict was two definitions (gross vs. net) sharing one name. Governance assigns an owner and a documented definition so the metric means the same thing everywhere — the single source of truth.", "src": "gaps-information-systems"}, {"id": "gaps-managerial-accounting-0", "domain": "Accounting", "q": "A food truck has $9,000/month fixed costs, sells bowls at $12 with $4 variable cost. Its monthly break-even is:", "opts": ["750 bowls", "2,250 bowls", "1,125 bowls"], "correct": 2, "fb": "CM = $12 − $4 = $8. Break-even = $9,000 ÷ $8 = 1,125 bowls. Each bowl contributes $8 toward fixed costs; it takes 1,125 of them to cover $9,000.", "src": "gaps-managerial-accounting"}, {"id": "gaps-managerial-accounting-1", "domain": "Accounting", "q": "A company sells more units every year but earns less profit, and \"something smells funny\" in its costing. The likeliest fix is:", "opts": ["Move from one blunt overhead rate to activity-based costing — a high-volume product may be subsidizing a support-heavy one", "Switch from managerial to financial accounting", "Raise the predetermined overhead rate across the board"], "correct": 0, "fb": "That's the exact ABC trigger from the corpus. A single rate misprices products that consume overhead unevenly; splitting overhead into activity pools with their own drivers reveals which product is really losing money.", "src": "gaps-managerial-accounting"}, {"id": "gaps-managerial-accounting-2", "domain": "Accounting", "q": "Actual cost ran $1,000 over standard. The price variance is $1,000 U and the quantity variance is $37.50 F. What should the manager do?", "opts": ["Tell the line staff to use less material — they're being wasteful", "Investigate purchasing/the supplier — the overspend is price, not usage; usage was actually slightly favorable", "Nothing — the variances roughly cancel out"], "correct": 1, "fb": "The split is the whole point. A large unfavorable price variance with a favorable quantity variance says you paid too much per unit while using a bit less than allowed. The problem is procurement, not the line.", "src": "gaps-managerial-accounting"}, {"id": "gaps-marketing-strategy-0", "domain": "Marketing", "q": "A founder says their target market is \"everyone with money.\" What's the STP fix?", "opts": ["Spend more on ads to reach everyone", "Lower the price so everyone can afford it", "Segment the market and target the most attractive group by size, profitability, and ease of reach"], "correct": 2, "fb": "\"Everyone\" is the beginner's mistake. STP says split the market into segments, then pick the commercially attractive one(s) — not on size alone, but on what they'll pay and how cheaply you can reach them.", "src": "gaps-marketing-strategy"}, {"id": "gaps-marketing-strategy-1", "domain": "Marketing", "q": "According to Byron Sharp, the bigger lever for brand growth is:", "opts": ["Penetration — acquiring more buyers; loyalty follows as a side-effect", "Deepening loyalty among existing heavy buyers", "Raising prices on your most loyal customers"], "correct": 0, "fb": "The double jeopardy law: grow penetration and loyalty rises with it, but not vice versa. Most sales come from many light buyers, so \"reach more people more often\" beats milking a small loyal core.", "src": "gaps-marketing-strategy"}, {"id": "gaps-marketing-strategy-2", "domain": "Marketing", "q": "A subscription has $25 AOV, 60% gross margin, and 22% monthly churn. Roughly how long does the average customer stay, and what does that imply for CAC?", "opts": ["~22 months; spend whatever it takes", "~4.5 months (1 ÷ 0.22); keep CAC below the resulting LTV (≈$92)", "~1 month; CAC is irrelevant"], "correct": 1, "fb": "Average lifetime = 1 ÷ churn = 1 ÷ 0.22 ≈ 4.5 months. Chaining margin × lifetime gives LTV ≈ $92 — the ceiling on what you can spend to acquire a customer and stay profitable.", "src": "gaps-marketing-strategy"}, {"id": "gaps-statistics-quant-0", "domain": "Quantitative & Statistics", "q": "Your regression of size on weight gives R² = 0.60. What does that mean?", "opts": ["You're 60% confident the relationship is real", "Weight explains 60% of the variation in size; the other 40% is unexplained", "60% of your data points sit exactly on the line"], "correct": 1, "fb": "R² = (SS(mean) − SS(fit)) / SS(mean) = (11.1 − 4.4)/11.1 ≈ 0.60. It's the share of variation in Y the line accounts for — not a confidence level and not a count of points on the line. Whether it's statistically significant is a separate p-value.", "src": "gaps-statistics-quant"}, {"id": "gaps-statistics-quant-1", "domain": "Quantitative & Statistics", "q": "Your A/B test returns p = 0.24 at a 0.05 threshold. The right call is:", "opts": ["Reject the null — the new version clearly wins", "Accept the null — you've proven the two are identical", "Fail to reject — a gap this size happens ~24% of the time by chance, so you can't rule out luck"], "correct": 2, "fb": "p = 0.24 > 0.05, so you fail to reject the null. Exactly StatQuest's \"p = 0.24, so we cannot be certain there is a difference.\" You don't prove they're equal — you just couldn't distinguish the result from random noise.", "src": "gaps-statistics-quant"}, {"id": "gaps-statistics-quant-2", "domain": "Quantitative & Statistics", "q": "Two groups' 95% confidence intervals do NOT overlap. You can conclude:", "opts": ["There's a statistically significant difference (p < 0.05) — no further test needed", "The difference is definitely caused by your treatment", "Nothing — overlap or not, you must always run a t-test"], "correct": 0, "fb": "Non-overlapping 95% CIs guarantee p < 0.05 — \"you can rest assured there's a statistically significant difference.\" (Significance isn't causation, though.) The catch runs the other way: if they DO overlap, it's inconclusive and you still need the t-test.", "src": "gaps-statistics-quant"}];
const BLUEPRINT = {"Strategy": "High", "Finance": "High", "Marketing": "High", "Accounting": "High", "Quantitative & Statistics": "High", "Management & OB": "High", "Economics": "Med", "Operations": "Med", "Information Systems": "Med", "Legal & Ethical": "Med", "International Business": "Med", "Communication": "Med", "Integration": "Med"};  // MFT-MBA relative emphasis
let order=[], answers={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){
  order = BANK.map((q,i)=>i); shuffle(order); answers={};
  const wrap=document.getElementById('questions'); wrap.innerHTML='';
  order.forEach((qi,n)=>{
    const q=BANK[qi];
    const div=document.createElement('div'); div.className='exam-q'; div.id='q'+qi;
    div.innerHTML='<span class="dtag">'+(n+1)+' &middot; '+q.domain+'</span><p class="qn">'+q.q+'</p>'+
      q.opts.map((o,oi)=>'<button class="exam-opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>').join('')+
      '<p class="exam-fb">'+q.fb+'</p>';
    wrap.appendChild(div);
  });
  document.querySelectorAll('.exam-opt').forEach(b=>b.addEventListener('click',function(){
    const qi=this.dataset.q; if(document.getElementById('result').classList.contains('show'))return;
    document.querySelectorAll('.exam-opt[data-q="'+qi+'"]').forEach(x=>x.classList.remove('sel'));
    this.classList.add('sel'); answers[qi]=+this.dataset.o; updateProg();
  }));
  document.getElementById('result').classList.remove('show');
  document.getElementById('result').innerHTML='';
  document.getElementById('submit').style.display=''; document.getElementById('retake').style.display='none';
  updateProg(); window.scrollTo(0,0);
}
function updateProg(){document.getElementById('prog').textContent=Object.keys(answers).length+' / '+BANK.length+' answered';}
function band(p){return p>=85?'Distinction':p>=70?'Pass (solid)':p>=55?'Marginal pass':'Below pass — review';}
function grade(){
  const byDom={}; let correct=0;
  BANK.forEach((q,qi)=>{
    const d=q.domain; byDom[d]=byDom[d]||{c:0,t:0};
    byDom[d].t++; const a=answers[qi];
    const opts=document.querySelectorAll('.exam-opt[data-q="'+qi+'"]');
    opts.forEach((o,oi)=>{if(oi===q.correct)o.classList.add('correct'); if(oi===a&&a!==q.correct)o.classList.add('wrong');});
    document.querySelector('#q'+qi+' .exam-fb').classList.add('show');
    if(a===q.correct){correct++; byDom[d].c++;}
  });
  const pct=Math.round(100*correct/BANK.length);
  const rows=Object.keys(byDom).sort().map(d=>{
    const o=byDom[d], p=Math.round(100*o.c/o.t);
    return '<div class="dom-row"><span>'+d+'</span><span class="dom-bar"><i style="width:'+p+'%"></i></span><span style="text-align:right;color:var(--dim)">'+o.c+'/'+o.t+'</span></div>';
  }).join('');
  const r=document.getElementById('result');
  r.innerHTML='<div class="band">'+band(pct)+'</div><h2>'+pct+'%</h2>'+
    '<p style="color:var(--dim);margin:.2em 0 16px">'+correct+' of '+BANK.length+' correct &middot; self-diagnostic, blueprinted to MFT-MBA domains</p>'+
    '<div style="border-top:1px solid var(--line);padding-top:14px">'+rows+'</div>'+
    '<p class="note" style="margin-top:18px">Indicative only: this scores <b>recall of the taught material</b>, not full MBA mastery. '+
    'Weak domains above are your study targets — open the matching lesson from the Index. Unanswered count as wrong.</p>';
  r.classList.add('show');
  document.getElementById('submit').style.display='none'; document.getElementById('retake').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('submit').addEventListener('click',grade);
document.getElementById('retake').addEventListener('click',render);
document.getElementById('introNote').textContent=
  BANK.length+' questions across '+new Set(BANK.map(q=>q.domain)).size+' MBA domains, drawn from every lesson\'s comprehension checks. '+
  'Answer what you can, then Submit & Score for an overall result and a per-domain breakdown.';
render();
</script></body></html>
